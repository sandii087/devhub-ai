name: DevHub checks
on:
  push:
    paths: ["devhub/**", ".github/workflows/devhub-*.yml"]
  pull_request:
    paths: ["devhub/**", ".github/workflows/devhub-*.yml"]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: devhub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d devhub_test"
          --health-interval 3s --health-retries 20
    defaults:
      run:
        working-directory: devhub
    env:
      DATABASE_URL: postgresql+psycopg://postgres:test-only-password@localhost:5432/devhub_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:test-only-password@localhost:5432/devhub_test
      ENVIRONMENT: development
      DEV_AUTH_ENABLED: "true"
      APP_ORIGIN: http://localhost:5174
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: devhub/requirements.lock}
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm, cache-dependency-path: devhub/frontend/package-lock.json}
      - name: Locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          npm ci --prefix frontend --no-fund
      - name: Security checks
        run: |
          python -m pip install detect-secrets==1.5.0 pip-audit==2.10.1 # pragma: allowlist secret
          python scripts/check_secrets.py
          pip-audit -r requirements.lock --disable-pip --no-deps
      - name: Backend checks and PostgreSQL migrations
        run: |
          ruff check backend scripts
          ruff format --check backend scripts
          alembic -c backend/alembic.ini upgrade head
          pytest -q
          python scripts/check_migrations.py
      - name: Frontend tests and build
        run: |
          npm test --prefix frontend
          npm run build --prefix frontend
          npm audit --prefix frontend --omit=dev --audit-level=high
      - name: Browser journeys
        run: |
          cd frontend
          npx playwright install --with-deps chromium
          cd ..
          uvicorn devhub.main:app --host 127.0.0.1 --port 8001 --no-access-log > /tmp/devhub-api.log 2>&1 &
          npm run dev --prefix frontend -- --strictPort > /tmp/devhub-web.log 2>&1 &
          python scripts/wait_ready.py
          cd frontend
          npx playwright test
      - name: Build containers and validate Compose
        run: |
          docker compose config --quiet
          docker build -t devhub-api:ci .
          docker build -f frontend/Dockerfile -t devhub-web:ci .
      - name: Browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devhub-browser-results
          path: |
            devhub/frontend/playwright-report
            devhub/output/playwright
          retention-days: 7

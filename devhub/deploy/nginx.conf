limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 15s;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location ~ ^/auth/(login|dev-login|callback)$ {
        limit_req zone=login_limit burst=10 nodelay;
        proxy_pass http://api:8001;
        proxy_set_header Host $http_host;
        proxy_read_timeout 50s;
        proxy_hide_header X-Powered-By;
        access_log off;
    }
    location ~ ^/(api/|auth/|health/) {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://api:8001;
        proxy_set_header Host $http_host;
        proxy_read_timeout 50s;
        proxy_hide_header X-Powered-By;
        access_log off;
    }
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
